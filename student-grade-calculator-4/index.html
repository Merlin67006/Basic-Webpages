<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 400px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Grade Calculator</h1>

    <!-- Student roll number -->
    <input type="text" id="rollNo" placeholder="Enter Roll Number">

    <!-- Five subject marks -->
    <input type="number" id="mark1" placeholder="Subject 1 Marks" min="0" max="99">
    <input type="number" id="mark2" placeholder="Subject 2 Marks" min="0" max="99">
    <input type="number" id="mark3" placeholder="Subject 3 Marks" min="0" max="99">
    <input type="number" id="mark4" placeholder="Subject 4 Marks" min="0" max="99">
    <input type="number" id="mark5" placeholder="Subject 5 Marks" min="0" max="99">

    <br>

    <!-- Calculate button -->
    <button onclick="calculateResult()">Calculate Result</button>

    <!-- Result displayed here -->
    <div id="result"></div>

</div>

<script>

// User-defined function
function calculateResult() {

    // Get roll number
    let rollNo = document.getElementById("rollNo").value;

    // Store five subject marks
    let marks = [
        Number(document.getElementById("mark1").value),
        Number(document.getElementById("mark2").value),
        Number(document.getElementById("mark3").value),
        Number(document.getElementById("mark4").value),
        Number(document.getElementById("mark5").value)
    ];

    // Validate marks
    for (let i = 0; i < 5; i++) {

        if (marks[i] < 10 || marks[i] > 99 || isNaN(marks[i])) {

            alert("Enter valid two-digit marks (10-99) for all subjects.");
            return;
        }
    }

    // Calculate total
    let total = 0;

    for (let i = 0; i < 5; i++) {
        total = total + marks[i];
    }

    // Calculate average
    let average = total / 5;

    // Calculate grade
    let grade;

    if (average >= 90) {
        grade = "A+";
    }
    else if (average >= 80) {
        grade = "A";
    }
    else if (average >= 70) {
        grade = "B";
    }
    else if (average >= 60) {
        grade = "C";
    }
    else if (average >= 50) {
        grade = "D";
    }
    else {
        grade = "F";
    }

    // Check pass or fail
    let status = "PASS";

    for (let i = 0; i < 5; i++) {

        if (marks[i] < 35) {
            status = "FAIL";
        }
    }

    // Display result on webpage
    document.getElementById("result").innerHTML =
        "<h2>Student Result</h2>" +
        "<p><b>Roll Number:</b> " + rollNo + "</p>" +
        "<p><b>Total:</b> " + total + " / 500</p>" +
        "<p><b>Average:</b> " + average.toFixed(2) + "</p>" +
        "<p><b>Grade:</b> " + grade + "</p>" +
        "<p><b>Status:</b> " + status + "</p>";
}

</script>

</body>
</html>
